<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>supercargo</title>
<link rel="stylesheet" href="static/app.css">
<script src="static/app.js" defer></script>
</head>
<body data-theme="grayscale-dark">

<header>
  <span class="wordmark">⟨u⟩lp</span>
  <span class="who"><b id="company"></b><span class="dim" id="domain"></span></span>
  <span class="dim" id="sep">·</span>
  <span class="who"><span id="persona"></span><span class="dim" id="persona-roles"></span></span>
  <span class="spacer"></span>
  <span class="demo-badge" id="demo" hidden data-tip="Sign-in has no password: for local demos only.">DEMO MODE</span>
  <span class="status" id="status"><span class="dot" id="dot"></span><span id="status-text">connecting…</span></span>
  <button id="theme" data-tip="Switch between the grayscale dark and light themes.">theme</button>
  <button id="signout">sign out</button>
</header>

<nav class="roles" id="roles"></nav>

<main>
  <section class="panel tall" id="left"></section>
  <section class="panel">
    <div class="panel-bar">
      <span class="panel-title">Messages</span>
      <span class="hint">this node's side only</span>
      <span class="filters" id="msg-filters">
        <button class="on" data-f="all" data-tip="Every message this node sent or received, for your roles: verified or not.">all</button><button data-f="refused" data-tip="Only the messages this node refused: a bad signature, a replay, a request it may not answer, or something that isn't a message at all.">refused</button>
      </span>
    </div>
    <div class="panel-body" id="messages"></div>
  </section>
  <section class="panel">
    <div class="panel-bar">
      <span class="panel-title">Activity</span>
      <span class="filters" id="act-filters">
        <button class="on" data-f="all" data-tip="Everything this node did, for your roles.">all</button><button data-f="envelope" data-tip="A message in or out, and what the node decided about it: verified, refused, sent. The message itself, every byte, is in the Messages panel.">envelope</button><button data-f="record" data-tip="A track &amp; trace event or alert: recorded (received for one of your shipments) or published (sent to a customer).">record</button><button data-f="model" data-tip="A call to an AI model: which model and skills, tokens, latency, and whether its answer passed validation (if not, a template answered instead).">model</button>
      </span>
    </div>
    <div class="panel-body" id="activity"></div>
  </section>
</main>

<div class="login" id="login">
  <div class="login-card">
    <h1 id="login-title">Sign in</h1>
    <p>Pick who you are. Each persona acts in the roles listed; you only ever see those roles' messages and activity.</p>
    <div id="personas"></div>
    <div class="login-foot">⚠ Demo mode: no password. Real sign-in (IAP) comes with the hosted deployment.</div>
  </div>
</div>
</body>
</html>
