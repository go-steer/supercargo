# Publishes the docs' self-contained HTML pages (the proposal walk-throughs,
# the UI mockup) to GitHub Pages, with an index: dev/tools/build-pages.
# GitHub shows an .html file's source; this is where they run.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'dev/tools/build-pages'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: dev/tools/build-pages _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
